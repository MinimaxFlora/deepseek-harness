name: docker-publish

# Build the image, smoke-test the boot, then push it to Docker Hub as
#   :latest  +  :<upstream version auto-detected from npm>
#
# The upstream version is read from the registry at run time
# (`@deepseek-ai/dsh` dist-tag `latest`), so a bump upstream is picked up by the
# next run instead of waiting for someone to edit the Dockerfile. The Dockerfile
# ARG stays as the fallback for local builds and for a failed registry lookup —
# and as the guard: if an upstream release changes the client bundle, the build
# fails loudly instead of shipping an image whose settings page is broken.
#
# Docker Hub credentials are OPTIONAL: without DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN the run builds and smoke-tests only, so a fresh clone is green
# before any secret exists. Add both and the same run also pushes.
#
# Action refs are pinned to published major tags — these actions have no `main`
# branch, so `@main` fails to resolve.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  IMAGE: dockorae/deepseek-harness

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream version
        id: ver
        run: |
          set -euo pipefail
          version=$(npm view @deepseek-ai/dsh dist-tags.latest 2>/dev/null | tr -d '[:space:]')
          if [ -z "$version" ]; then
            version=$(awk -F= '/^ARG DSH_VERSION=/{print $2}' Dockerfile | tr -d ' \r')
            echo "::warning::npm registry lookup failed — falling back to the Dockerfile pin ($version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream @deepseek-ai/dsh ${version}"

      - name: Decide whether to push
        id: mode
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set — building and smoke-testing only."
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # buildx refuses `--load` together with `--push`, and the smoke test must run
      # on THIS build rather than on whatever the tag resolves to in the registry —
      # so the image is always loaded locally here, and the push happens later as a
      # plain `docker push` (layers are already cached).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image the way the compose file does (read-only rootfs, tmpfs
      # /tmp) and assert the two behaviours this image exists for: the webserver
      # binds all interfaces, and the client-side loopback gate is gone while the
      # /api fence survives. Assertions read the files inside the container, so a
      # reworded log line cannot turn this red.
      - name: Smoke test the boot
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/dsh-data/dsh" "$RUNNER_TEMP/dsh-data/caddy"
          docker run -d --name dsh-ci \
            --read-only --tmpfs /tmp:mode=1777,size=256m \
            --security-opt no-new-privileges:true \
            -e HTTPS_ACCESS_HOST=127.0.0.1 \
            -v "$RUNNER_TEMP/dsh-data/dsh:/data/dsh" \
            -v "$RUNNER_TEMP/dsh-data/caddy:/data/caddy" \
            "$IMAGE:$TAG"
          echo "image under test: $IMAGE:$TAG ($(docker image inspect -f '{{.Id}}' "$IMAGE:$TAG" | cut -c1-19))"
          status=starting
          for _ in $(seq 1 40); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' dsh-ci 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          docker logs dsh-ci 2>&1 | grep -E '\[entrypoint\]|client patch|dsh web:' || true
          echo "health=$status"
          [ "$status" = "healthy" ] || { echo "::error::container never became healthy"; exit 1; }

          docker exec dsh-ci ss -lntp | grep -q '0.0.0.0:3080' \
            || { echo "::error::webserver is not bound to all interfaces"; exit 1; }

          client=$(docker exec dsh-ci sh -c 'find /usr/local/lib/node_modules -path "*/@deepseek-ai/dsh-client-connection/lib/client.js" -print -quit')
          [ -n "$client" ] || { echo "::error::client bundle not found in the image"; exit 1; }
          docker exec dsh-ci grep -q 'isLoopback: .*|| true,' "$client" \
            || { echo "::error::client-side loopback gate is not patched ($client)"; exit 1; }
          docker exec dsh-ci grep -q 'isLoopbackHostname(hostUrl.hostname)' "${client%/*}/index.js" \
            || { echo "::error::the /api Host fence is missing"; exit 1; }
          echo "smoke test passed: healthy, bound 0.0.0.0:3080, client gate patched, /api fence intact"

      - name: Log in to Docker Hub
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push latest + version tag
        if: steps.mode.outputs.push == 'true'
        run: |
          set -euo pipefail
          docker push --all-tags "$IMAGE"
          echo "pushed $IMAGE:latest and $IMAGE:${{ steps.ver.outputs.version }}"
